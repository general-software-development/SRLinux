[project]
name = "syspkg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bogdan", email = "github.34373732@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "packaging>=26.3",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "stlib-ext>=0.3.0",
    "typer>=0.27.2",
]

[project.scripts]
pkg = "syspkg.cli:app"
syspkg = "syspkg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syspkg"]
